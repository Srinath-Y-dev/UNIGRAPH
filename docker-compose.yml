services:
  unigraph-iq:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/unigraph.db
      UPLOAD_DIR: /app/data/uploads
      EXPORT_DIR: /app/data/exports
    volumes:
      - unigraph_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  unigraph_data:
